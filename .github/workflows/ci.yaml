name: CI

on: [push, pull_request]

# Default to 'contents: read', which grants actions to read commits. Any
# permission not included is implicitly set to "none".
#
# see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20 # guardrails timeout

    strategy:
      fail-fast: false
      matrix:
        go: ["1.12", "1.21", "1.22", "1.23", "oldstable", "stable"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        # Cannot enable shuffle for now because some tests rely on global state and order
        # run: go test -race -v -shuffle=on ./...
        run: go test -race -v ./...

      - name: Test native 32-bit integer ranges
        if: matrix.go == 'stable'
        run: GOARCH=386 CGO_ENABLED=0 go test -v -run '^TestNativeIntegerFlagRange$' .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20 # guardrails timeout

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "stable"

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest

  api-compatibility:
    name: API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "stable"

      - name: Install API compatibility checker
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20261119141654-b15d094f3610

      - name: Check API compatibility with the latest release
        # Check the root v1 module only; additions are allowed, removals are not.
        run: gorelease -base=latest
